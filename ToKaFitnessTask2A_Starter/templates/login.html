{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form class="panel form-stack narrow" method="post">
  <label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email">
  <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
  <button type="submit">Sign in</button>
  <p>New to ToKa? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</form>
{% endblock %}
