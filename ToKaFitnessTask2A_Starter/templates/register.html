{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Create your free account</h1>
<form class="panel form-stack narrow" method="post">
  <label for="username">Username</label><input id="username" name="username" required minlength="3" maxlength="40" autocomplete="username">
  <label for="email">Email address</label><input id="email" name="email" type="email" required autocomplete="email">
  <label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
  <button type="submit">Register</button>
</form>
{% endblock %}
