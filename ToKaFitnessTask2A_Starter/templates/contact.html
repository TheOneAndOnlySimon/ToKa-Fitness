{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}
{% block content %}
<h1>Contact ToKa Fitness</h1>
<form class="panel form-stack narrow" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="name">Your name</label><input id="name" name="name" required>
  <label for="email">Email address</label><input id="email" name="email" type="email" required>
  <label for="message">How can we help?</label><textarea id="message" name="message" rows="5" required></textarea>
  <button type="submit">Send enquiry (demo)</button>
  <small>This starter does not store enquiries yet.</small>
</form>
{% endblock %}
